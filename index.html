
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행운의 로또 추첨기 🍀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #f3f8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      color: #16834a;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .lotto-game {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .game-label {
      width: 35px;
      color: #888;
      font-size: 13px;
    }

    .ball {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: white;
      box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.12);
    }

    .yellow {
      background: #fbc02d;
    }

    .blue {
      background: #2196f3;
    }

    .red {
      background: #f44336;
    }

    .gray {
      background: #9e9e9e;
    }

    .green {
      background: #4caf50;
    }

    button {
      margin-top: 25px;
      padding: 16px 30px;
      border: none;
      border-radius: 30px;
      background: #16834a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #106638;
      transform: translateY(-2px);
    }

    .notice {
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🍀 행운의 로또 추첨기</h1>
    <p class="subtitle">오늘의 행운 번호 5게임을 만나보세요!</p>

    <div id="lottoBoard"></div>

    <button onclick="generateLotto()">
      ✨ 로또 번호 5게임 생성하기
    </button>

    <p class="notice">
      번호는 무작위로 생성되며 당첨을 보장하지 않습니다.
    </p>
  </div>

  <script>
    function generateLotto() {
      const board = document.getElementById("lottoBoard");
      board.innerHTML = "";

      for (let game = 1; game <= 5; game++) {
        const numbers = [];

        while (numbers.length < 6) {
          const number = Math.floor(Math.random() * 45) + 1;

          if (!numbers.includes(number)) {
            numbers.push(number);
          }
        }

        numbers.sort((a, b) => a - b);

        const row = document.createElement("div");
        row.className = "lotto-game";

        const label = document.createElement("span");
        label.className = "game-label";
        label.textContent = game + "게임";
        row.appendChild(label);

        numbers.forEach(number => {
          const ball = document.createElement("div");
          ball.className = "ball " + getBallColor(number);
          ball.textContent = number;
          row.appendChild(ball);
        });

        board.appendChild(row);
      }
    }

    function getBallColor(number) {
      if (number <= 10) return "yellow";
      if (number <= 20) return "blue";
      if (number <= 30) return "red";
      if (number <= 40) return "gray";
      return "green";
    }

    generateLotto();
  </script>
</body>
</html>
